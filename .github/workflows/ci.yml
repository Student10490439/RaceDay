name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build API
        run: dotnet build RaceDay.Api.csproj -c Release

      - name: Build Tests
        run: dotnet build RaceDay.Api.Tests.csproj -c Release
